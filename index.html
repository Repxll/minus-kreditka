<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Минус кредитка</title>
<meta name="theme-color" content="#050706">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кредитка">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: тёмная мобильная аппка. Зелёный прожектор сверху, герой-карта с огромным словом и 3D-маскотом,
   крупная цифра по центру, тёмные плитки 2×2, белая pill-кнопка, нижние шторки, стеклянный таб-бар */
:root{
  --bg:#050706; --s1:#0f1311; --s2:#171c1a; --s3:#212725; --line:rgba(255,255,255,.07);
  --fg:#f3f7f5; --muted:#8a948f; --dim:#5d6762;
  --mint:#62f0a6; --green:#3fdc8b; --glow:rgba(70,230,150,.55); --red:#ff6b57;
  --font:"Onest",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{scrollbar-width:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;left:50%;top:-260px;width:760px;height:620px;transform:translateX(-50%);background:radial-gradient(closest-side,var(--glow),rgba(70,230,150,.12) 55%,transparent 80%);pointer-events:none;z-index:0}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--mint);outline-offset:3px;border-radius:12px}
.app{position:relative;z-index:1;max-width:440px;margin:0 auto;padding-block:8px 132px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:16px}
.view[hidden]{display:none!important}

/* top bar */
.bar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;height:48px}
.bar h1{grid-column:2;text-align:center;font-size:16px;font-weight:600;margin:0}
.sync{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);justify-self:end}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.sync.on i{background:var(--green);box-shadow:0 0 10px var(--green)}

/* hero stage: mascot centered in the spotlight, standing on a glowing pedestal */
.hero{position:relative;height:200px;display:grid;place-items:end center;isolation:isolate}
.hero::before{content:"";position:absolute;left:50%;bottom:8px;width:220px;height:46px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(98,240,166,.55),rgba(98,240,166,.12) 60%,transparent);filter:blur(2px);z-index:-1}
.hero::after{content:"";position:absolute;left:50%;bottom:22px;width:150px;height:14px;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.55);filter:blur(6px);z-index:-1}
.hero img{width:200px;height:200px;object-fit:contain;filter:drop-shadow(0 18px 36px rgba(60,230,140,.4));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}

/* big number block */
.amount{text-align:center;padding:4px 0 2px}
.amount .big{font-size:54px;font-weight:800;letter-spacing:-.045em;line-height:1}
.amount .big span{font-size:34px;color:var(--muted);font-weight:700;margin-left:4px}
.amount .cap{color:var(--muted);margin-top:8px}
.amount .acc{color:var(--green);font-weight:600;font-size:14px;margin-top:6px}
.edit{display:inline-flex;align-items:center;gap:6px}
.edit svg{width:16px;height:16px;opacity:.6}

/* progress track, segmented like a slider */
.track{position:relative}
.track .val{position:absolute;top:0;transform:translateX(-50%);font-size:13px;font-weight:700;white-space:nowrap}
.track .rail{margin-top:22px;height:46px;border-radius:16px;background:var(--s2);position:relative;overflow:hidden}
.track .fill{position:absolute;inset:4px auto 4px 4px;border-radius:12px;background:linear-gradient(90deg,#1f9b5d,var(--green));box-shadow:0 0 22px rgba(63,220,139,.5);min-width:0;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.track .thumb{position:absolute;top:8px;bottom:8px;width:3px;border-radius:2px;background:#fff;transform:translateX(-50%);transition:left .7s cubic-bezier(.2,.8,.2,1)}
.track .ticks{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--dim)}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px;min-width:0}
.tile b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tile.g b{color:var(--green)}

/* buttons */
.cta{height:60px;border-radius:30px;background:#fff;color:#07100b;font-weight:700;font-size:17px;width:100%;transition:transform .15s}
.cta:active{transform:scale(.98)}
.cta.dark{background:var(--s3);color:var(--fg)}
.cta:disabled{opacity:.4}
.ghost{color:var(--muted);font-size:14px;font-weight:500;padding:10px;align-self:center}

/* section labels and lists */
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 4px -4px}
.list{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:4px 14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.ic{width:44px;height:44px;border-radius:14px;background:var(--s2);display:grid;place-items:center;font-size:21px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15.5px}
.row .t span{display:block;color:var(--muted);font-size:13px}
.row .a{font-weight:700;white-space:nowrap}
.row .a.g{color:var(--green)}
.empty{color:var(--muted);text-align:center;padding:22px 8px;font-size:14px}

/* week */
.week{display:flex;justify-content:space-between;background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:14px 12px}
.d{display:flex;flex-direction:column;align-items:center;gap:7px;width:40px;font-size:12px;color:var(--dim)}
.d i{width:38px;height:38px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
.d.plan i{box-shadow:inset 0 0 0 1.5px rgba(98,240,166,.55)}
.d.done i{background:var(--green);color:#03140a;box-shadow:0 0 16px rgba(63,220,139,.45)}
.d.today{color:var(--fg);font-weight:700}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:4px}
.seg button{height:44px;border-radius:16px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--fg)}

/* paycheck switcher */
.pcnav{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:6px}
.pcnav button{width:44px;height:44px;border-radius:16px;background:var(--s2);display:grid;place-items:center}
.pcnav button:disabled{opacity:.25}
.pcnav svg{width:20px;height:20px}
.pcnav div{text-align:center}
.pcnav b{display:block;font-size:17px;font-weight:700}
.pcnav span{font-size:12.5px;color:var(--muted)}
.pcnav span.now{color:var(--green)}
.remind{display:flex;align-items:center;gap:12px;text-align:left;width:100%;border-radius:22px;padding:14px 16px;background:rgba(242,179,61,.12);box-shadow:inset 0 0 0 1px rgba(242,179,61,.35)}
.remind[hidden]{display:none}
.remind b{display:block;font-weight:700}
.remind span{display:block;color:var(--muted);font-size:13px}
.remind i{font-style:normal;font-size:22px}
.lock{font-size:13px;color:var(--muted);text-align:center;margin:-4px 0}
.tick:disabled{opacity:.35;cursor:default}
.tile.btn{text-align:left;width:100%}

/* envelope table */
.grp{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:4px 14px}
.grp h3{margin:12px 0 2px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.env{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.env:last-child{border-bottom:0}
.env .ic{width:40px;height:40px;font-size:19px;border-radius:13px}
.env .t{flex:1;min-width:0}
.env .t b{display:block;font-weight:600}
.env .t span{display:block;font-size:12.5px;color:var(--muted)}
.env .a{font-weight:700;white-space:nowrap}
.tick{width:32px;height:32px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--s3);display:grid;place-items:center;flex:none;transition:background .2s}
.tick svg{width:16px;height:16px;opacity:0}
.tick[aria-pressed="true"]{background:var(--green);box-shadow:0 0 14px rgba(63,220,139,.45)}
.tick[aria-pressed="true"] svg{opacity:1}
.env.done .t b,.env.done .a{color:var(--dim)}
.cc{display:flex;align-items:center;gap:14px;border-radius:24px;padding:18px;background:linear-gradient(180deg,rgba(63,220,139,.16),rgba(63,220,139,.05));box-shadow:inset 0 0 0 1px rgba(98,240,166,.35)}
.cc .t{flex:1}
.cc .t span{color:var(--muted);font-size:13px;display:block}
.cc .t b{display:block;font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--mint)}
.cc .tick{width:48px;height:48px}
.cc .tick svg{width:22px;height:22px}

/* advice card */
.advice{position:relative;text-align:center;background:var(--s1);border:1px solid var(--line);border-radius:30px;padding:120px 22px 26px;overflow:hidden}
.advice::before{content:"";position:absolute;left:50%;top:-80px;width:340px;height:260px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(70,230,150,.35),transparent);pointer-events:none}
.advice img{position:absolute;left:50%;top:6px;width:130px;height:130px;transform:translateX(-50%)}
.advice small{display:block;color:var(--muted);font-size:13px;margin-bottom:8px;position:relative}
.advice p{position:relative;margin:0;font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.02em;text-wrap:balance}

/* schedule */
.sch .row .t b{font-size:15px}
.sch .meter{height:6px;border-radius:3px;background:var(--s2);margin-top:6px;overflow:hidden}
.sch .meter i{display:block;height:100%;background:var(--green);border-radius:3px}

/* nav */
.nav{position:fixed;left:50%;bottom:calc(16px + max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px)));transform:translateX(-50%);display:flex;align-items:center;gap:2px;padding:6px;border-radius:99px;background:rgba(28,32,30,.72);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 18px 40px -10px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.08);z-index:20}
.tab{height:50px;min-width:58px;border-radius:99px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;color:rgba(255,255,255,.55);font-weight:600}
.tab svg{width:22px;height:22px;flex:none}
.tab .tl{display:none}
.tab[aria-current="page"]{background:#fff;color:#07100b}
.tab[aria-current="page"] .tl{display:inline}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,440px);transform:translate(-50%,105%);background:#0d1110;border-radius:32px 32px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.08);z-index:41;padding:10px max(20px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px));transition:transform .35s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;gap:16px;max-height:92vh;overflow:auto}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--s3);align-self:center}
.sheet h2{margin:0;text-align:center;font-size:17px;font-weight:600}
.money{display:flex;flex-direction:column;gap:4px}
.money label{color:var(--muted);font-size:14px}
.money .in{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line);padding-bottom:10px}
.money input{flex:0 1 auto;field-sizing:content;min-width:1ch;max-width:100%;font-size:44px;font-weight:800;letter-spacing:-.04em;outline:0}
.money input::placeholder{color:var(--s3)}
.money .in span{font-size:30px;font-weight:700;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:38px;padding:0 14px;border-radius:19px;background:var(--s2);font-weight:600;font-size:14px}
.chip:active{background:var(--s3)}
.line{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px 16px;min-height:56px}
.line span{color:var(--muted)}
.line input[type=date]{font-weight:600;text-align:right;outline:0;min-width:0;color-scheme:dark}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;background:var(--s2);font-size:20px;font-weight:600}
.step b{min-width:56px;text-align:center;font-size:17px}
.checkline{display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--fg);font-size:15px}
.checkline input{appearance:none;width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--s3);display:grid;place-items:center;flex:none;margin:0}
.checkline input:checked{background:var(--green);box-shadow:none}
.checkline input:checked::after{content:"";width:6px;height:11px;border:solid #03140a;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.danger{color:var(--red)}
.note{color:var(--muted);font-size:13px;text-align:center;margin:-4px 0 0}

/* celebrate + toast */
.party{position:fixed;inset:0;display:grid;place-items:center;z-index:50;pointer-events:none;opacity:0;transition:opacity .25s}
.party.on{opacity:1}
.party div{text-align:center;transform:scale(.8);transition:transform .45s cubic-bezier(.2,1.4,.3,1)}
.party.on div{transform:scale(1)}
.party img{width:220px;height:220px;filter:drop-shadow(0 20px 50px rgba(60,230,140,.6))}
.party b{display:block;font-size:40px;font-weight:900;letter-spacing:-.04em;color:var(--mint);text-shadow:0 0 30px rgba(63,220,139,.6)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--s3);border-radius:99px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:14px;font-weight:600;font-size:14px;z-index:30;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:#fff;color:#07100b;border-radius:99px;padding:8px 14px;font-weight:700}
.toast button[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* settings button */
.bar .gear{grid-column:3;justify-self:end;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.06);display:grid;place-items:center}
.bar .gear svg{width:20px;height:20px;opacity:.75}
.bar .gear[hidden]{display:none}

/* onboarding */
.onb{display:flex;flex-direction:column;gap:16px;min-height:calc(100vh - 120px);padding-bottom:24px}
.onb[hidden]{display:none!important}
.onb .hero{height:170px}
.onb .hero img{width:170px;height:170px}
.onb .q{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.12;text-align:center;text-wrap:balance;margin:0}
.onb .sub{color:var(--muted);text-align:center;margin:-6px 0 4px;font-size:15px;text-wrap:balance}
.dots{display:flex;gap:6px;justify-content:center;margin-top:4px}
.dots i{width:18px;height:4px;border-radius:2px;background:var(--s3)}
.dots i.on{background:var(--green);box-shadow:0 0 8px rgba(63,220,139,.5)}
.onb .push{flex:1}
.fld{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:0 16px;min-height:58px}
.fld span{color:var(--muted);flex:none}
.fld input,.fld select{background:none;text-align:right;font-weight:700;font-size:17px;outline:0;min-width:0;width:100%;color:var(--fg)}
.fld input::placeholder{color:var(--dim);font-weight:500}
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:6px 14px}
.erow{display:grid;grid-template-columns:1fr 112px 32px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.erow.two{grid-template-columns:1fr auto 32px}
.erow.two .n{grid-column:1/-1}
.erow:last-child{border-bottom:0}
.erow input{background:var(--s2);border-radius:12px;padding:11px 12px;font-weight:600;outline:0;min-width:0;width:100%}
.erow input.n{font-weight:500}
.erow .x{width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:20px}
.dsel{display:flex;background:var(--s2);border-radius:12px;padding:3px;gap:2px}
.dsel button{height:34px;min-width:34px;padding:0 6px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.dsel button[aria-pressed="true"]{background:var(--s3);color:var(--fg)}
.add{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;color:var(--mint);font-weight:600;width:100%}
.sum{display:flex;flex-direction:column;gap:2px;text-align:center;background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:18px}
.sum b{font-size:34px;font-weight:800;letter-spacing:-.04em;color:var(--mint)}
.sum span{color:var(--muted);font-size:14px}
.warn{color:#f2b33d;text-align:center;font-size:14px;font-weight:600}
.days{display:flex;justify-content:space-between;gap:4px}
.days button{width:40px;height:40px;border-radius:50%;background:var(--s2);font-size:12.5px;font-weight:700;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--green);color:#03140a}
.menu .row{padding:14px 0}
.fld.plain{border:0;background:none;padding:0;border-radius:0}
.fld.plain+.fld.plain{border-top:1px solid var(--line)}
.fld b{font-size:17px;white-space:nowrap}
body.onb-on .toast{bottom:calc(100px + max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px)))}
.menu .row .a{color:var(--muted);font-weight:500;font-size:14px}

/* ---------- storage: Claude cloud, Telegram cloud, or this browser ---------- */
const Store={
  key:"mk-state",cloud:null,ref:null,timer:null,chain:Promise.resolve(),chunks:0,warned:false,
  init(){if(TG){const u=TG.initDataUnsafe&&TG.initDataUnsafe.user;if(u&&u.id)this.key="mk-state-"+u.id;if(ver("6.9"))this.cloud=TG.CloudStorage}},
  readLocal(){try{const v=localStorage.getItem(this.key);return v?JSON.parse(v):null}catch(e){return null}},
  save(){S.ts=Date.now();const str=JSON.stringify(S);try{localStorage.setItem(this.key,str)}catch(e){}
    clearTimeout(this.timer);this.timer=setTimeout(()=>{
      if(this.ref){const body=JSON.parse(str);this.chain=this.chain.then(()=>this.ref.set(body)).catch(()=>this.fail())}
      else if(this.cloud){this.chain=this.chain.then(()=>this.cloudWrite(str)).catch(()=>this.fail())}},500)},
  fail(){if(this.warned)return;this.warned=true;toast(this.cloud?"Не удалось сохранить в Telegram, данные остались на телефоне":"Нет связи с облаком, сохраняю на этом устройстве")},
  call(m,...a){return new Promise((res,rej)=>this.cloud[m](...a,(e,v)=>e?rej(e):res(v)))},
  async cloudRead(){const n=+(await this.call("getItem","n"))||0;if(!n)return null;const keys=[...Array(n)].map((_,i)=>"s"+i);const o=await this.call("getItems",keys);this.chunks=n;return JSON.parse(keys.map(k=>o[k]||"").join(""))},

/* ---------- paychecks ---------- */
function paychecks(){const c=C(),out=[],now=today(),f=new Date(c.first+"T12:00"),days=[...c.days].sort((a,b)=>a-b);let y=f.getFullYear(),m=f.getMonth();
  for(let g=0;g<600;g++){for(const s of days){const d=new Date(y,m,Math.min(s,dim(y,m)),12),k=iso(d);if(k<c.first)continue;out.push({d,k,s});if(k>now)return out}if(++m>11){m=0;y++}}return out}
const slotOf=k=>{const d=new Date(k+"T12:00");return C().days.find(s=>Math.min(s,dim(d.getFullYear(),d.getMonth()))===d.getDate())};
function salaryOf(k,s){if(S.salary[k])return S.salary[k];const prev=Object.keys(S.salary).filter(x=>/^\d{4}-/.test(x)&&x<k&&slotOf(x)===s).sort().pop();return prev?S.salary[prev]:(C().pay[s]||0)}
function cushionAmt(ch){const c=C();if(ch&&ch.cushion)return ch.cushionAmt||c.cushionStep;return Math.max(0,Math.min(c.cushionStep,c.cushionGoal-S.cushion))}
function rowsFor(s,ch){const r=C().envs.filter(e=>e.day===s&&e.a>0).map(e=>({...e}));const ca=cushionAmt(ch);if(ca>0||(ch&&ch.cushion))r.push({id:"cushion",n:"Подушка",a:ca,g:"cush"});return r}
const ccFor=(k,s,ch)=>Math.max(0,salaryOf(k,s)-rowsFor(s,ch).reduce((a,e)=>a+e.a,0));
const sideMonthly=()=>C().side.on?C().side.goal*4.33:0;
const monthPlan=()=>C().days.reduce((a,s)=>a+ccFor("9999",s,{}),0)+sideMonthly();
const paid=()=>S.payments.reduce((a,p)=>a+p.amount,0);
const left=()=>Math.max(0,S.start-paid());
function schedule(b=left(),pm=monthPlan(),rate=C().rate){let r=[],d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1);while(b>0&&pm>0&&r.length<60){const i=b*rate/100/12;b+=i;const p=Math.min(pm,b);b-=p;r.push({m:new Date(d),i,p,b});d.setMonth(d.getMonth()+1)}return r}
function week(){const d=new Date(),w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return [...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return iso(x)})}

const lastPassed=()=>{const t=today();let i=0;pcs.forEach((p,j)=>{if(p.k<=t)i=j});return i};
const PC=()=>pcs[pcI];
const isFuture=()=>PC().k>today();

function track(el,ratio,label){const r=Math.max(0,Math.min(1,ratio));const fill=el.querySelector(".fill"),th=el.querySelector(".thumb"),v=el.querySelector(".val");
  fill.style.width=r>0?`calc((100% - 8px) * ${r})`:"0";th.style.left=`calc(4px + (100% - 8px) * ${r})`;v.textContent=label;v.style.left=`calc(4px + (100% - 8px) * ${r})`;v.style.transform=r<.2?"translateX(-4px)":r>.8?"translateX(calc(-100% + 4px))":"translateX(-50%)";}

function draftFromCfg(){const c=C();if(!c)return{debt:0,rate:"",stmt:25,days:[10,25],pay:{},must:[{n:"Аренда",a:0,day:10},{n:"Связь и интернет",a:0,day:10}],life:[{n:"Продукты",a:0},{n:"Транспорт",a:0},{n:"Кафе и личное",a:0}],cushionGoal:10000,cushionStep:3000,side:{on:true,label:"Подработка",goal:5000,days:[0,2,4,5]}};
  const life={};c.envs.filter(e=>e.g==="life").forEach(e=>{(life[e.n]=life[e.n]||{id:e.id,n:e.n,a:0}).a+=e.a});
  return{debt:left(),rate:c.rate,stmt:c.stmt,days:[...c.days],pay:{...c.pay},must:c.envs.filter(e=>e.g==="must").map(e=>({...e})),life:Object.values(life),cushionGoal:c.cushionGoal,cushionStep:c.cushionStep,side:structuredClone(c.side)}}
function cfgFromDraft(d){const days=[...d.days].sort((a,b)=>a-b);const envs=[];
  d.must.filter(e=>e.n.trim()&&e.a>0).forEach(e=>envs.push({id:e.id||uid(),n:e.n.trim(),a:e.a,day:days.includes(e.day)?e.day:days[0],g:"must"}));
  d.life.filter(e=>e.n.trim()&&e.a>0).forEach(e=>{const id=e.id||uid(),part=Math.round(e.a/days.length);days.forEach((s,i)=>envs.push({id,n:e.n.trim(),a:i===days.length-1?e.a-part*(days.length-1):part,day:s,g:"life"}))});
  const old=C();let first=old&&old.first;if(!first){const t=new Date();let best=null;for(let back=0;back<2&&!best;back++){const y=t.getFullYear(),m=t.getMonth()-back,yy=m<0?y-1:y,mm=(m+12)%12;[...days].reverse().forEach(s=>{const dd=new Date(yy,mm,Math.min(s,dim(yy,mm)),12);if(!best&&iso(dd)<=today())best=iso(dd)})}first=best||today()}
  return{rate:+d.rate,stmt:Math.min(31,Math.max(1,+d.stmt||25)),days,pay:Object.fromEntries(days.map(s=>[s,d.pay[s]||0])),first,created:(old&&old.created)||today(),cushionGoal:d.cushionGoal,cushionStep:Math.min(d.cushionStep,d.cushionGoal)||0,side:{...d.side,goal:d.side.goal||0},envs}}
function openOnb(only){D=draftFromCfg();editOnly=only||null;step=only?STEPS.indexOf(only):0;showApp(false);renderOnb();if(only||C())pushBack(onbBack)}

  if(name==="must")h=`${dots}<h2 class="q">Обязательные платежи</h2><p class="sub">Аренда, кредиты, связь — всё, что платишь каждый месяц${D.days.length>1?". Выбери, с какой зарплаты":""}</p><div class="card">${D.must.map((e,i)=>`<div class="erow${D.days.length>1?" two":""}"><input class="n" data-mn="${i}" value="${esc(e.n)}" placeholder="Название">${mi("must:"+i,e.a,"₽")}${daySel(i,e.day)}<button class="x" data-mdel="${i}" aria-label="Убрать">×</button></div>`).join("")||'<div class="empty">Пока пусто</div>'}<button class="add" id="o-addm">+ Добавить платёж</button></div>${cta(nextTxt)}`;
  if(name==="life")h=`${dots}<h2 class="q">Сколько уходит на жизнь в месяц?</h2><p class="sub">${D.days.length>1?"Сумма разделится пополам между двумя зарплатами":"Продукты, транспорт, личное — по-честному, как тратишь сейчас"}</p><div class="card">${D.life.map((e,i)=>`<div class="erow"><input class="n" data-ln="${i}" value="${esc(e.n)}" placeholder="Название">${mi("life:"+i,e.a,"₽")}<button class="x" data-ldel="${i}" aria-label="Убрать">×</button></div>`).join("")||'<div class="empty">Пока пусто</div>'}<button class="add" id="o-addl">+ Добавить расход</button></div>${cta(nextTxt)}`;
  if(name==="extra")h=`${dots}<h2 class="q">Подушка и подработка</h2><p class="sub">Подушка спасает от новых трат с кредитки, когда что-то сломалось</p><div class="card"><div class="fld" style="border:0;background:none;padding:0"><span>Подушка, цель ₽</span>${mi("cg",D.cushionGoal,"10 000")}</div><div class="fld" style="border:0;background:none;padding:0;border-top:1px solid var(--line);border-radius:0"><span>Откладывать с зарплаты</span>${mi("cs",D.cushionStep,"3 000")}</div></div>
    <label class="checkline"><input type="checkbox" id="o-side" ${D.side.on?"checked":""}>Есть подработка — доставка, такси, фриланс</label>
    ${D.side.on?`<div class="card"><div class="fld" style="border:0;background:none;padding:0"><span>Как называется</span><input data-k="label" value="${esc(D.side.label)}" maxlength="18" style="font-weight:600"></div><div class="fld" style="border:0;background:none;padding:0;border-top:1px solid var(--line);border-radius:0"><span>Цель на неделю, ₽</span>${mi("sg",D.side.goal,"5 000")}</div><div style="padding:10px 0 12px;border-top:1px solid var(--line)"><div class="note" style="text-align:left;margin:0 0 8px">В какие дни планируешь</div><div class="days">${WD.map((w,i)=>`<button data-wd="${i}" aria-pressed="${D.side.days.includes(i)}">${w}</button>`).join("")}</div></div></div>`:""}${cta(editOnly?"Сохранить":"Посчитать")}`;
  if(name==="done"){const cfg=cfgFromDraft(D),old=S.cfg;S.cfg=cfg;const per=cfg.days.reduce((a,s)=>a+Math.max(0,(cfg.pay[s]||0)-rowsFor(s,{}).reduce((x,e)=>x+e.a,0)),0),over=cfg.days.reduce((a,s)=>a+Math.min(0,(cfg.pay[s]||0)-rowsFor(s,{}).reduce((x,e)=>x+e.a,0)),0),sm=sideMonthly(),pm=per+sm,rows=schedule(D.debt,pm,cfg.rate),last=rows[rows.length-1];S.cfg=old;
    h=`<div class="hero"><img src="${IMG.win}" alt=""></div><h2 class="q">${last?`Свобода к ${MD[last.m.getMonth()]} ${last.m.getFullYear()}`:"Пока не сходится"}</h2><div class="sum"><b>${rub(pm)}</b><span>в месяц будет уходить в кредитку${cfg.side.on?`, из них ~${rub(sm)} с подработки`:""}</span></div>${over<0?`<p class="warn">Расходы больше зарплаты на ${rub(-over)}. Урежь конверты, иначе долг не уменьшится</p>`:""}${last?`<p class="sub">Переплата по процентам ≈ ${rub(rows.reduce((a,r)=>a+r.i,0))}. Чем больше закидываешь, тем меньше отдаёшь банку</p>`:""}${cta("Поехали","o-finish")}`}

function onbValidate(){const n=STEPS[step];
  if(n==="debt"){if(!(D.debt>0))return"Введи сумму долга";const r=+String(D.rate).replace(",",".");if(!(r>0&&r<200))return"Введи ставку, например 35";D.rate=r;if(!(D.stmt>=1&&D.stmt<=31))return"День выписки — число от 1 до 31"}
  if(n==="pay"){if(D.days.some(s=>!(s>=1&&s<=31)))return"Число месяца — от 1 до 31";if(new Set(D.days).size!==D.days.length)return"Выплаты в разные дни";if(D.days.some(s=>!(D.pay[s]>0)))return"Введи сумму зарплаты"}
  if(n==="extra"&&D.side.on&&!D.side.label.trim())D.side.label="Подработка";
  return null}
function onbCommit(){const cfg=cfgFromDraft(D),isNew=!C();if(isNew){S=structuredClone(DEFAULT);S.start=D.debt}else if(editOnly==="debt"){S.start=D.debt+paid()}S.cfg=cfg;save();pcs=paychecks();pcI=lastPassed();if(isNew){D=null;editOnly=null;showApp(true);switchView("debt");render();party(0);$("party-t").textContent="Поехали!";backStack=[];if(TG&&ver("6.1"))TG.BackButton.hide()}else{closeOnb();toast("Сохранено")}}
$("v-onb").addEventListener("input",e=>{const t=e.target;if(!D)return;
  if(t.classList.contains("mi")){const n=digits(t.value);t.value=n?fmt(n):"";const k=t.dataset.k;
    if(k==="debt")D.debt=n;else if(k==="cg")D.cushionGoal=n;else if(k==="cs")D.cushionStep=n;else if(k==="sg")D.side.goal=n;else if(k.startsWith("pay:"))D.pay[+k.slice(4)]=n;else if(k.startsWith("must:"))D.must[+k.slice(5)].a=n;else if(k.startsWith("life:"))D.life[+k.slice(5)].a=n;return}
  if(t.dataset.k==="rate")D.rate=t.value.replace(/[^\d,.]/g,"");
  if(t.dataset.k==="stmt")D.stmt=digits(t.value);
  if(t.dataset.k==="label")D.side.label=t.value;
  if(t.dataset.day!==undefined){const i=+t.dataset.day,old=D.days[i],nv=digits(t.value);D.days[i]=nv;D.pay[nv]=D.pay[old];D.must.forEach(m=>{if(m.day===old)m.day=nv})}
  if(t.dataset.mn!==undefined)D.must[+t.dataset.mn].n=t.value;
  if(t.dataset.ln!==undefined)D.life[+t.dataset.ln].n=t.value;});

$("v-onb").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||!D)return;
  if(b.id==="o-next"){const err=onbValidate();if(err)return toast(err);haptic();if(editOnly)return onbCommit();step++;renderOnb();if(step===1&&!C())pushBack(onbBack);return}

function switchView(v){view=v;document.querySelectorAll(".view").forEach(x=>x.hidden=x.id!=="v-"+v);document.querySelectorAll(".tab").forEach(t=>{if(t.dataset.v===v)t.setAttribute("aria-current","page");else t.removeAttribute("aria-current")});$("title").textContent={debt:"Мой долг",ship:sideName(),plan:"План на зарплату"}[v];scrollTo({top:0})}
